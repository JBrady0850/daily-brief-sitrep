name: Publish app to GitHub Pages
# One-time setup: repository Settings > Pages > Build and deployment > Source: "GitHub Actions".
# Until then this workflow skips with a notice instead of failing.
# Every run also rebuilds the backup collection (app/data/news-cache.json): stories for
# every library category from Google News and every library feed, which the web page
# reads when the GDELT news index is busy. Recent stories from the file already on the
# site are kept, so a run that Google News turns away cannot empty a category.
# It also rebuilds local news by state (app/data/local/<STATE>.json) from the news
# feeds of local TV stations, which the page reads for the categories about your
# town. Free, no key, no secret, and nothing runs anywhere but here.
on:
  push:
    branches: [main]
    paths: ["app/**", "dailybrief/**", ".github/workflows/pages.yml"]
  schedule:
    - cron: "23 */4 * * *"   # the backup collection, every four hours
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  check:
    # The schedule rebuilds the backup collection for the public site only; copies made
    # from the template skip it (a public copy with its own Pages site can drop this line).
    if: github.event_name != 'schedule' || github.repository == 'JBrady0850/daily-brief-sitrep'
    runs-on: ubuntu-24.04
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --silent 2>/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=GitHub Pages is off::Turn it on in Settings > Pages > Source: GitHub Actions, then run this workflow again."
          fi
  deploy:
    needs: check
    if: needs.check.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - id: site
        uses: actions/configure-pages@v6
      - name: Backup collection (Google News and every library feed)
        # A failed collection never stops the app from publishing; the page then uses the news index.
        continue-on-error: true
        timeout-minutes: 15
        env:
          SITE: ${{ steps.site.outputs.base_url }}
        run: |
          curl -fsSL --max-time 30 -o "$RUNNER_TEMP/previous-news-cache.json" "$SITE/data/news-cache.json" \
            || echo "No backup collection on the site yet."
          python -m dailybrief build-cache --out app/data/news-cache.json --previous "$RUNNER_TEMP/previous-news-cache.json"
      - name: Local news by state (local TV station feeds)
        # Like the backup collection, a failed run never stops the app from publishing.
        continue-on-error: true
        timeout-minutes: 15
        env:
          SITE: ${{ steps.site.outputs.base_url }}
        run: python -m dailybrief build-local --out app/data/local --site "$SITE"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v5
