name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      REQUIRE_NODE: "1"
      REQUIRE_BROWSER: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pytest playwright
      - run: python -m playwright install --with-deps chromium
      - run: python -m dailybrief build-assets --check
      - run: python -m dailybrief scan .
      - run: python -m pytest -q
  windows:
    runs-on: windows-latest
    env:
      REQUIRE_NODE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - run: pip install pytest
      - run: python -m pytest -q --ignore=tests/test_ui.py
