name: Something is wrong
description: The app, the desktop app, the GitHub run or the AI prompt did not do what you expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Please leave out your email address, town, and anything else personal.
  - type: dropdown
    id: where
    attributes:
      label: Where
      options: [Web version, Desktop app, GitHub run, AI prompt, Command line]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to see it again
  - type: input
    id: version
    attributes:
      label: Version (Settings shows it) and device or browser
