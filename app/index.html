<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f2744">
<meta name="db-key" content="">
<title>Daily Brief</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Daily Brief">
<meta name="description" content="Your free morning news page: pick from 67 categories, get fresh stories, photos and your forecast every day. No account, no keys.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<a class="skip" href="#main">Skip to the content</a>
<header class="top">
  <div class="brand"><img src="icon.svg" alt="" width="30" height="30"><span>Daily Brief</span></div>
  <nav id="tabs" role="tablist" aria-label="Sections">
    <button data-tab="setup" role="tab"><span class="tl">Setup</span></button>
    <button data-tab="categories" role="tab" hidden><span class="tl">Categories</span></button>
    <button data-tab="brief" role="tab" hidden><span class="tl">Today's brief</span></button>
    <button data-tab="daily" role="tab" hidden><span class="tl">Every day</span></button>
    <button data-tab="ai" role="tab"><span class="tl">AI assistants</span></button>
    <span class="tab-gap" aria-hidden="true"></span>
    <button data-tab="settings" role="tab"><span class="tl">Settings</span></button>
    <button data-tab="help" role="tab"><span class="tl">Help</span></button>
  </nav>
</header>
<div id="modebar" class="modebar" role="status"></div>
<main id="main" tabindex="-1">
  <section id="tab-setup" class="tab" role="tabpanel" aria-label="Setup"></section>
  <section id="tab-categories" class="tab" role="tabpanel" aria-label="Categories"></section>
  <section id="tab-brief" class="tab" role="tabpanel" aria-label="Today"></section>
  <section id="tab-daily" class="tab" role="tabpanel" aria-label="Every day"></section>
  <section id="tab-ai" class="tab" role="tabpanel" aria-label="AI assistants"></section>
  <section id="tab-settings" class="tab" role="tabpanel" aria-label="Settings"></section>
  <section id="tab-help" class="tab" role="tabpanel" aria-label="Help"></section>
</main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<noscript><p class="noscript">The Daily Brief needs JavaScript turned on in this browser.</p></noscript>
<script src="data/library.js"></script>
<script src="data/prompts.js"></script>
<script src="data/sample.js"></script>
<script src="data/icons.js"></script>
<script src="data/calendars.js"></script>
<script src="js/engine.js"></script>
<script src="js/newsletter.js"></script>
<script src="js/collect.js"></script>
<script src="js/services.js"></script>
<script src="js/app.js"></script>
</body>
</html>
